name: klubbstugan

# Local and demo stack. Postgres is bound to 127.0.0.1 only.
#   docker compose up -d db              # database for `npm run dev`
#   docker compose --profile dev up -d   # also Mailpit
#   docker compose up -d --build         # the whole app, as on the demo server
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: klubbstugan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-klubbstugan}
      POSTGRES_DB: klubbstugan
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klubbstugan -d klubbstugan"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://klubbstugan:${DB_PASSWORD:-klubbstugan}@db:5432/klubbstugan
      # Content packs are imported with this image (CLAUDE.md, Content packs) and
      # write their images to the same volume the web service serves them from.
      NUXT_UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: postgresql://klubbstugan:${DB_PASSWORD:-klubbstugan}@db:5432/klubbstugan
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_THEME_SWITCH: ${NUXT_PUBLIC_THEME_SWITCH:-true}
      NUXT_DEFAULT_THEME: ${NUXT_DEFAULT_THEME:-klassisk}
      NUXT_UPLOADS_DIR: /app/uploads
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  db-data:
  uploads:
