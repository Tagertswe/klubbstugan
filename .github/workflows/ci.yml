name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: klubbstugan
          POSTGRES_PASSWORD: klubbstugan
          POSTGRES_DB: klubbstugan_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klubbstugan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://klubbstugan:klubbstugan@localhost:5432/klubbstugan_e2e
      NUXT_DATABASE_URL: postgresql://klubbstugan:klubbstugan@localhost:5432/klubbstugan_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d web
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 2
          done
          exit 1
      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/ | grep -q 'data-theme='
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/flodet)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/teamblekingelf/kalender)" = 301
      - name: Content pack import (as on a fresh deploy)
        run: |
          (cd e2e/fixtures/content-pack && zip -qr "$RUNNER_TEMP/pack.zip" .)
          docker compose run --rm -v "$RUNNER_TEMP/pack.zip:/tmp/pack.zip:ro" migrate npm run -s content -- import /tmp/pack.zip
          curl -fsS http://localhost:3000/nyheter/importerad-nyhet | grep -q 'Importerad nyhet'
          # Site settings are cached for up to a minute (server/utils/settings.ts).
          for i in $(seq 1 40); do
            hero="$(curl -fsS http://localhost:3000/api/home | grep -oE '/media/[a-z0-9-]+-hero\.png' || true)"
            [ -n "$hero" ] && break
            sleep 2
          done
          curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:3000$hero" | grep -q image/png
      - name: Logs on failure
        if: failure()
        run: docker compose logs
